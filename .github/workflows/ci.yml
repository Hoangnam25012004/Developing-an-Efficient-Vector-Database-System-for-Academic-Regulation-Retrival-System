name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  publish-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No private paths, no oversized files
        run: |
          bad=$(git ls-files | grep -E '^(Report/|\.env$|\.claude/|data/processed/_ingest/)' || true)
          if [ -n "$bad" ]; then echo "Paths that must not be published:"; echo "$bad"; exit 1; fi
          big=$(git ls-files -z | xargs -0 stat -c '%s %n' | awk '$1 > 52428800')
          if [ -n "$big" ]; then echo "Files over 50 MB:"; echo "$big"; exit 1; fi

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-vie fonts-dejavu-core
      - name: Python packages
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0
          python -m pip install -r requirements.lock
      - name: Unit tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -t . -v
