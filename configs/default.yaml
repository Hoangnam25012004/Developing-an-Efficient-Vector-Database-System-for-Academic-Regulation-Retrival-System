# Chunking
chunking:
  target_tokens: 320       # 150–300 tokens
  overlap_ratio: 0.08      # 8%

# Embeddings
embedding:
  model_name: "intfloat/multilingual-e5-base"
  normalize: true
  batch_size: 64

# Paths
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  indexes_dir: data/indexes
  bm25_index_path: data/indexes/bm25.pkl
  jsonl_glob: data/processed/*.jsonl

# Document defaults
doc_defaults:
  title: "Quy chế học vụ"
  version: "2023.09"
  effective_date: "2023-09-01"
  faculty: "All"
  language: "vi"

# Reranker
# Swap model_name to benchmark each candidate; run 06_rerank.py then 07_eval_metrics.py.
# Candidates:
#   BAAI/bge-reranker-v2-m3                  (CrossEncoder, sentence-transformers)
#   BAAI/bge-reranker-v2-gemma               (FlagLLMReranker, needs FlagEmbedding) chay ko noi
#   BAAI/bge-reranker-v2-minicpm-layerwise   (LayerWiseFlagLLMReranker, needs FlagEmbedding)
#   jinaai/jina-reranker-v2-base-multilingual (CrossEncoder + trust_remote_code)
#   itdainb/PhoRanker                        (CrossEncoder, sentence-transformers)
reranker:
  model_name: "BAAI/bge-reranker-v2-m3"
  batch_size: 32
  use_fp16: false        # set true for LLM-based rerankers on GPU
  cutoff_layers: [28]    # only used by bge-reranker-v2-minicpm-layerwise

# Qdrant
qdrant:
  url: "http://localhost:6333"
  api_key: ""
  collection: "reg_chunks"
  vector_size: 768
  distance: "Cosine"
  hnsw:
    m: 16
    ef_construct: 128
    ef: 128

# BM25
bm25:
  tokenizer: "vi_basic"

# Search
search:
  top_k: 10
  rrf_k: 60
  hybrid_dense_weight: 0.5