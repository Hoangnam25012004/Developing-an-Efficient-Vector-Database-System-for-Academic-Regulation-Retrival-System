# === Ingestion config for academic regulations (VN) ===
# Lưu ý: dùng mã hóa UTF-8 và giữ dấu tiếng Việt (không unidecode nội dung).
input_globs:
  - "data/raw/**/*.pdf"
  - "data/raw/**/*.docx"

encoding: "utf-8"

# Các bước tiền xử lý văn bản
preprocess:
  drop_empty_lines: true            # bỏ dòng trống, dòng chỉ có khoảng trắng
  collapse_whitespace: true         # gom nhiều space/newline thành 1
  normalize_unicode: "NFC"          # chuẩn hóa dấu tiếng Việt
  fix_hyphenation: true             # nối từ bị ngắt dòng bằng dấu '-\n'
  strip_headers_footers: true       # cho phép loại header/footer bằng regex phía dưới

# Chiến lược chunking theo token để phục vụ embedding & truy hồi
chunk:
  unit: "token"                     # "token" | "char"
  tokenizer_hint: "tiktoken/cl100k_base"   # gợi ý, không bắt buộc
  target_tokens: 220
  min_tokens: 140
  max_tokens: 320
  overlap_ratio: 0.25               # ~25% chồng lấn để không đứt ý
  # Ưu tiên cắt theo cấu trúc pháp quy nếu thấy marker ở dưới
  prefer_structure_boundaries: true

# Marker cấu trúc thường gặp trong văn bản quy phạm VN
structure_markers:
  chapter: '(?i)^\s*chương\s+[IVXLC0-9]+\b'
  section: '(?i)^\s*mục\s+[IVXLC0-9]+\b'
  subsection: '(?i)^\s*tiểu\s*mục\s+[IVXLC0-9]+\b'
  article: '(?i)^\s*điều\s+([0-9]{1,3})([a-z])?\b'
  clause:  '(?i)^\s*khoản\s+([0-9]{1,3})\b'
  point:   '(?i)^\s*điểm\s*([a-z])\)?\b'

# Regex loại nhiễu (header/footer, số trang…)
noise_patterns:
  - '(?i)^\s*trang\s+[0-9]+\s*/\s*[0-9]+\s*$'            # "Trang 3/45"
  - '^\s*[0-9]+\s*$'                                     # số trang đứng một mình
  - '(?i)\b(bản quyền|copyright)\b'
  - '(?i)^.*(trường|khoa|bộ môn).{0,40}(quy\s*chế|regulation).*$'
  - '(?i)^\s*số:\s*\S+/?\S+\s*[-–]?\s*\S+\s*$'           # "Số: 123/QĐ-ĐH..."
  - '(?i)^\s*bộ\s+giáo\s+dục\s+và\s+đào\s+tạo\s*$'
  - '(?i)^\s*cộng\s+hoà\s+xã\s+hội\s+chủ\s+nghĩa\s+việt\s+nam\s*$'

# Trích metadata (để gắn vào từng chunk)
metadata:
  capture:
    article_number: '(?i)^\s*điều\s+([0-9]{1,3})([a-z])?\b'
    clause_number:  '(?i)^\s*khoản\s+([0-9]{1,3})\b'
    point_letter:   '(?i)^\s*điểm\s*([a-z])\)?\b'
  inherit_from_previous_markers: true   # chunk không có marker sẽ thừa kế cấp gần nhất
  add_source_path: true
  add_page_number: true

# Đầu ra
output:
  dir: "data/processed"                  # nơi viết JSONL các chunk
  format: "jsonl"
  report_path: "data/stats/ingestion_report.json"
  log_dir: "data/stats"
  schema: "reg-retrieval.v1"             # khớp với scripts/01_schema.py của bạn
